<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Delina Bingo</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 18px 12px 30px;
    background: #10141c;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 5px 0 6px;
    font-size: 29px;
}

.subtitle {
    color: #9da7b7;
    margin-bottom: 16px;
}

.status {
    max-width: 450px;
    margin: 0 auto 15px;
    padding: 13px;
    border-radius: 12px;
    background: #1d2633;
    font-weight: bold;
}

.letters,
.card,
.called-box {
    width: 100%;
    max-width: 450px;
    margin-left: auto;
    margin-right: auto;
}

.letters {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
    margin-bottom: 7px;
}

.letter {
    background: #293446;
    padding: 10px 5px;
    border-radius: 9px;
    font-size: 21px;
    font-weight: bold;
}

.card {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
}

.cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #202938;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.cell:active {
    transform: scale(0.95);
}

.free {
    background: #7657d9;
}

.marked {
    background: #20a463;
}

.called-cell {
    border: 2px solid #f0b429;
}

.last {
    max-width: 450px;
    margin: 18px auto 0;
    background: #1d2633;
    padding: 14px;
    border-radius: 14px;
}

.last-title {
    font-size: 14px;
    color: #b9c0cc;
}

#lastNumber {
    font-size: 40px;
    font-weight: bold;
    margin-top: 4px;
}

.called-box {
    margin-top: 15px;
    padding: 15px;
    background: #1d2633;
    border-radius: 14px;
    text-align: left;
}

.called-title {
    text-align: center;
    font-weight: bold;
    margin-bottom: 10px;
}

.called-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
}

.called-number {
    background: #293446;
    padding: 7px 10px;
    border-radius: 8px;
    font-weight: bold;
}

.live {
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
}

.bingo-button {
    margin-top: 17px;
    width: 100%;
    max-width: 450px;
    padding: 16px;
    border: none;
    border-radius: 13px;
    background: #20a463;
    color: white;
    font-size: 20px;
    font-weight: bold;
}

.bingo-button:active {
    transform: scale(0.98);
}

#message {
    margin-top: 15px;
    min-height: 25px;
    color: #b9c0cc;
}

.players {
    margin-top: 8px;
    color: #9da7b7;
}

.game-over {
    background: #8f2525 !important;
}

.winner {
    background: #8a6410 !important;
}

</style>

</head>

    <div class="letter">B</div>
    <div class="letter">I</div>

    <div class="letter">G</div>

</div>

<div class="card" id="card">
    Loading card...
</div>

<div class="last">

        LAST CALLED
    </div>

    <div id="lastNumber">
        —
    </div>

</div>
