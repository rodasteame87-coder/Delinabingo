<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Delina Bingo</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 18px 12px 30px;
    background: #10141c;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 5px 0 6px;
    font-size: 29px;
}

.subtitle {
    color: #9da7b7;
    margin-bottom: 16px;
}

.status {
    max-width: 450px;
    margin: 0 auto 15px;
    padding: 13px;
    border-radius: 12px;
    background: #1d2633;
    font-weight: bold;
}

.letters,
.card,
.called-box {
    width: 100%;
    max-width: 450px;
    margin-left: auto;
    margin-right: auto;
}

.letters {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
    margin-bottom: 7px;
}

.letter {
    background: #293446;
    padding: 10px 5px;
    border-radius: 9px;
    font-size: 21px;
    font-weight: bold;
}

.card {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
}

.cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #202938;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.cell:active {
    transform: scale(0.95);
}

.free {
    background: #7657d9;
}

.marked {
    background: #20a463;
}

.called-cell {
    border: 2px solid #f0b429;
}

.last {
    max-width: 450px;
    margin: 18px auto 0;
    background: #1d2633;
    padding: 14px;
    border-radius: 14px;
}

.last-title {
    font-size: 14px;
    color: #b9c0cc;
}

#lastNumber {
    font-size: 40px;
    font-weight: bold;
    margin-top: 4px;
}

.called-box {
    margin-top: 15px;
    padding: 15px;
    background: #1d2633;
    border-radius: 14px;
    text-align: left;
}

.called-title {
    text-align: center;
    font-weight: bold;
    margin-bottom: 10px;
}

.called-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
}

.called-number {
    background: #293446;
    padding: 7px 10px;
    border-radius: 8px;
    font-weight: bold;
}

.live {
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
}

.bingo-button {
    margin-top: 17px;
    width: 100%;
    max-width: 450px;
    padding: 16px;
    border: none;
    border-radius: 13px;
    background: #20a463;
    color: white;
    font-size: 20px;
    font-weight: bold;
}

.bingo-button:active {
    transform: scale(0.98);
}

#message {
    margin-top: 15px;
    min-height: 25px;
    color: #b9c0cc;
}

.players {
    margin-top: 8px;
    color: #9da7b7;
}

.game-over {
    background: #8f2525 !important;
}

.winner {
    background: #8a6410 !important;
}

</style>
</head>

<body>

<h1>🎯 DELINA BINGO</h1>

<div class="subtitle">
    Online Bingo
</div>

<div class="status" id="status">
    🔄 Connecting...
</div>

<div class="players">
    👥 Players:
    <strong id="players">0</strong>
</div>

<br>

<div class="letters">

    <div class="letter">B</div>
    <div class="letter">I</div>
    <div class="letter">N</div>
    <div class="letter">G</div>
    <div class="letter">O</div>

</div>

<div class="card" id="card">
    Loading card...
</div>

<div class="last">

    <div class="last-title">
        LAST CALLED
    </div>

    <div id="lastNumber">
        —
    </div>

</div>

<div class="called-box">

    <div class="called-title">
        🎱 Numbers Called
    </div>

    <div
        class="called-list"
        id="calledList">
    </div>

</div>

<div class="live" id="live">
    🔴 Game is not running
</div>

<button
    class="bingo-button"
    id="bingoButton"
    onclick="claimBingo()">

    🏆 BINGO

</button>

<div id="message"></div>


<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

let myCard = [];
let marked = new Set();


// ===============================
// CREATE BINGO CARD
// ===============================

function createCard() {

    const card = [];

    // B column
    const B = randomNumbers(1, 15);

    // I column
    const I = randomNumbers(16, 30);

    // N column
    const N = randomNumbers(31, 45);

    // G column
    const G = randomNumbers(46, 60);

    // O column
    const O = randomNumbers(61, 75);

    for (let row = 0; row < 5; row++) {

        card.push([
            B[row],
            I[row],
            N[row],
            G[row],
            O[row]
        ]);

    }

    // FREE SPACE
    card[2][2] = "FREE";

    myCard = card;

    renderCard();
}


// ===============================
// RANDOM NUMBERS
// ===============================

function randomNumbers(min, max) {

    const numbers = [];

    for (let i = min; i <= max; i++) {
        numbers.push(i);
    }

    numbers.sort(() => Math.random() - 0.5);

    return numbers.slice(0, 5);
}


// ===============================
// DISPLAY CARD
// ===============================

function renderCard() {

    const cardElement = document.getElementById("card");

    cardElement.innerHTML = "";

    for (let row = 0; row < 5; row++) {

        for (let col = 0; col < 5; col++) {

            const value = myCard[row][col];

            const cell = document.createElement("div");

            cell.className = "cell";

            cell.textContent = value;

            if (value === "FREE") {

                cell.classList.add("free");

                marked.add("FREE");

            }

            if (marked.has(value)) {
                cell.classList.add("marked");
            }

            cell.onclick = function() {

                if (value === "FREE") {
                    return;
                }

                if (marked.has(value)) {

                    marked.delete(value);

                    cell.classList.remove("marked");

                } else {

                    marked.add(value);

                    cell.classList.add("marked");
                }

            };

            cardElement.appendChild(cell);
        }
    }
}


// ===============================
// LOAD GAME STATE
// ===============================

async function loadState() {

    try {

        const response =
            await fetch("/api/state?t=" + Date.now());

        const data =
            await response.json();

        console.log("GAME STATE:", data);


        // Players
        document.getElementById("players")
            .textContent = data.players || 0;


        // Game status
        const status =
            document.getElementById("status");

        const live =
            document.getElementById("live");


        if (data.running) {

            status.textContent =
                "🟢 Game is LIVE";

            status.className =
                "status";

            live.textContent =
                "🟢 Game is running";

        } else {

            status.textContent =
                "🔴 Game is STOPPED";

            status.className =
                "status game-over";

            live.textContent =
                "🔴 Game is not running";
        }


        // Called numbers
        const called =
            data.called || [];

        updateCalledNumbers(called);


        // Last number
        if (called.length > 0) {

            const last =
                called[called.length - 1];

            document.getElementById("lastNumber")
                .textContent = getLetter(last) + "-" + last;

        } else {

            document.getElementById("lastNumber")
                .textContent = "—";
        }


        // Highlight numbers on card
        highlightCalledNumbers(called);

    }

    catch (error) {

        console.error(error);

        document.getElementById("status")
            .textContent =
            "⚠️ Connection error";
    }
}


// ===============================
// CALLED NUMBERS
// ===============================

function updateCalledNumbers(numbers) {

    const list =
        document.getElementById("calledList");

    list.innerHTML = "";

    numbers.forEach(number => {

        const item =
            document.createElement("div");

        item.className =
            "called-number";

        item.textContent =
            getLetter(number) + "-" + number;

        list.appendChild(item);

    });
}


// ===============================
// BINGO LETTER
// ===============================

function getLetter(number) {

    if (number >= 1 && number <= 15)
        return "B";

    if (number >= 16 && number <= 30)
        return "I";

    if (number >= 31 && number <= 45)
        return "N";

    if (number >= 46 && number <= 60)
        return "G";

    if (number >= 61 && number <= 75)
        return "O";

    return "";
}


// ===============================
// HIGHLIGHT CALLED NUMBERS
// ===============================

function highlightCalledNumbers(numbers) {

    const cells =
        document.querySelectorAll(".cell");

    cells.forEach(cell => {

        const value =
            parseInt(cell.textContent);

        if (numbers.includes(value)) {

            cell.classList.add("called-cell");

        } else {

            cell.classList.remove("called-cell");
        }

    });
}


// ===============================
// CLAIM BINGO
// ===============================

async function claimBingo() {

    const message =
        document.getElementById("message");

    message.textContent =
        "Checking your card...";


    try {

        const response =
            await fetch("/api/bingo", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    card: myCard,

                    marked:
                        Array.from(marked),

                    user_id:
                        tg.initDataUnsafe?.user?.id || null

                })

            });


        const data =
            await response.json();


        if (data.success) {

            message.textContent =
                "🎉 BINGO! You won!";

            message.className =
                "winner";

        } else {

            message.textContent =
                data.message ||
                "❌ Bingo not valid.";

        }

    }

    catch (error) {

        console.error(error);

        message.textContent =
            "⚠️ Could not contact server.";
    }
}


// ===============================
// START
// ===============================

createCard();

loadState();


// Update every 2 seconds

setInterval(loadState, 2000);

</script>

</body>
</html>
