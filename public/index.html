<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Delina Bingo</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #10131a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-bottom: 5px;
        }

        #status {
            margin: 15px 0;
            font-size: 18px;
        }

        .test {
            padding: 20px;
            border-radius: 15px;
            background: #1d2430;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>🎯 Delina Bingo</h1>

    <div id="status">
        Loading...
    </div>

    <div class="test">
        🎉 Bingo Mini App is connected!
    </div>

    <script>

        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();

        document.getElementById("status").innerText =
            "🟢 Mini App is running";

    </script>

</body>
</html>
